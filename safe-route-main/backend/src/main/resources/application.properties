# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/saferoute_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool (prevents "too many connections" errors)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ── JPA ───────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=SafeRouteSecretKey2024VeryLongSecretKeyForJWTTokenGeneration
jwt.expiration=86400000

# ── Server ────────────────────────────────────────────────────────────────────
server.port=8080

# ── Misc fixes ────────────────────────────────────────────────────────────────
spring.main.allow-circular-references=true
spring.mvc.pathmatch.use-suffix-pattern=false
spring.main.allow-bean-definition-overriding=true
spring.security.filter.order=10